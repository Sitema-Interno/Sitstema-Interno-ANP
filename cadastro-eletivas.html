    .btn-danger { background-color: #e11d48; border: none; color: white;}

  <!-- CABEÇALHO -->

        <a href="index.html" class="btn btn-outline-secondary btn-sm fw-semibold rounded-pill px-3 shadow-sm" style="border-color: #cbd5e1; color: #334155;">

  <div class="main-container">
    
    <!-- ÁREA 1: CADASTRAR NOVA ELETIVA -->
    <div class="card p-4">
      <div class="card-header-custom">
        <h4><i class="bi bi-plus-circle-fill text-primary me-2"></i>1. Cadastrar Nova Eletiva</h4>
      </div>
      <form id="formCadastro" onsubmit="event.preventDefault(); salvarNovaEletiva();">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label fw-semibold text-muted small">Semestre / Ano</label>
            <select id="cadAno" class="form-select" required></select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold text-muted small">Dia da Semana</label>
            <select id="cadDia" class="form-select" required>
              <option value="">Selecione...</option>
              <option value="SEGUNDA-FEIRA">SEGUNDA-FEIRA</option>
              <option value="TERÇA-FEIRA">TERÇA-FEIRA</option>
              <option value="QUARTA-FEIRA">QUARTA-FEIRA</option>

              <option value="2º ANO">2º ANO</option>

          <div class="col-md-3">
            <label class="form-label fw-semibold text-muted small">Vagas</label>
            <input type="number" id="cadVagas" class="form-control" min="1" max="100" placeholder="Ex: 25" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted small">Nome da Eletiva</label>
            <input type="text" id="cadNome" class="form-control" placeholder="Ex: LGG038 - INGLÊS BÁSICO" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold text-muted small">Professor / Gestão</label>
            <select id="cadProfessor" class="form-select" required>
              <option value="">Carregando professores...</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-4" id="btnCadastrar">
          <i class="bi bi-save me-2"></i>Cadastrar Eletiva
        </button>
      </form>
    </div>

    <!-- ÁREA 2: PESQUISAR E GERENCIAR ELETIVAS -->
    <div class="card p-4">
      <div class="card-header-custom d-flex justify-content-between align-items-center flex-wrap gap-3">
        <h4><i class="bi bi-search text-primary me-2"></i>2. Gerenciar Eletivas</h4>
        
        <div class="d-flex gap-2">
          <div class="input-group" style="width: 220px;">
            <select id="buscaAno" class="form-select">
              <option value="">Semestre...</option>
            </select>
            <button class="btn btn-secondary" style="background-color: #64748b; border:none;" onclick="buscarEletivas()" title="Pesquisar"><i class="bi bi-search"></i></button>
          </div>
          <!-- Botão Gerar PDF -->
          <button class="btn btn-danger" id="btnPdfEletivas" style="display:none;" onclick="baixarPDFEletivas()" title="Baixar Relatório PDF">
            <i class="bi bi-file-earmark-pdf-fill me-1"></i> PDF
          </button>
        </div>
      </div>
      
      <div id="loaderBusca" class="loader text-center my-3"><i class="bi bi-arrow-repeat spin me-2"></i>A buscar eletivas...</div>
      
      <div class="table-responsive" style="display:none;" id="areaTabela">
        <table class="table table-hover border rounded" id="tabelaEletivas">
          <thead>
            <tr>
              <th>ID</th>
              <th>Dia</th>
              <th>Turma</th>
              <th>Eletiva</th>
              <th>Professor</th>
              <th class="text-center">Vagas</th>
              <th class="text-center no-pdf">Ações</th>

          </thead>
          <tbody id="corpoTabela"></tbody>

    </div>

  <!-- MODAL DE EDIÇÃO -->
  <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2"></i>Editar Eletiva</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formEditar" onsubmit="event.preventDefault(); salvarEdicao();">
            <input type="hidden" id="editLinha">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label small">Semestre / Ano</label>
                <select id="editAno" class="form-select" required></select>
              </div>
              <div class="col-md-4">
                <label class="form-label small">Dia da Semana</label>
                <select id="editDia" class="form-select" required>
                  <option value="SEGUNDA-FEIRA">SEGUNDA-FEIRA</option>
                  <option value="TERÇA-FEIRA">TERÇA-FEIRA</option>
                  <option value="QUARTA-FEIRA">QUARTA-FEIRA</option>
                  <option value="QUINTA-FEIRA">QUINTA-FEIRA</option>
                  <option value="SEXTA-FEIRA">SEXTA-FEIRA</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label small">Turma</label>
                <select id="editTurma" class="form-select" required>
                  <option value="1º ANO">1º ANO</option>
                  <option value="2º ANO">2º ANO</option>
                  <option value="3º ANO">3º ANO</option>
                </select>
              </div>
              <div class="col-md-8">
                <label class="form-label small">Nome da Eletiva</label>
                <input type="text" id="editNome" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label small">Vagas</label>
                <input type="number" id="editVagas" class="form-control" required>
              </div>
              <div class="col-md-12">
                <label class="form-label small">Professor / Gestão</label>
                <select id="editProfessor" class="form-select" required></select>
              </div>
            </div>

              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>

  <script>
    document.getElementById('anoAtual').innerText = new Date().getFullYear();

    const API_URL = "https://script.google.com/macros/s/AKfycbyNedpZQsNt5lzHtrCSRfC4bWFEuCHHkZ4ygbm-DDm0NUBVARwS5GNFMu2zB3WutFE/exec";

    let modalInstancia;

    async function chamarAPI(payload) {
      if (!navigator.onLine) {
        let fila = JSON.parse(localStorage.getItem('filaOffline') || '[]');
        fila.push(payload);
        localStorage.setItem('filaOffline', JSON.stringify(fila));
        
        Swal.fire({
          title: 'Sistema Interno ANP',
          text: '📴 Sem conexão com a internet! Os dados foram salvos no dispositivo e serão enviados automaticamente assim que a rede voltar.',
          icon: 'info',
          confirmButtonColor: '#0f766e'
        });
        return { success: true, msg: "Salvo localmente (Offline)." };
      }

      try {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
        return await res.json();
      } catch (e) {
        let fila = JSON.parse(localStorage.getItem('filaOffline') || '[]');
        fila.push(payload);
        localStorage.setItem('filaOffline', JSON.stringify(fila));
        
        Swal.fire({
          title: 'Aviso de Rede',
          text: '⚠️ Erro de rede. Dados guardados localmente para envio posterior.',
          icon: 'warning',
          confirmButtonColor: '#0f766e'
        });
        return { success: true, msg: "Salvo localmente por falha de rede." };
      }
    }

    // Sincroniza automaticamente assim que a internet volta
    window.addEventListener('online', async () => {
  let fila = JSON.parse(localStorage.getItem('filaOffline') || '[]');
  if (fila.length > 0) {
    Swal.fire({ title: 'A Sincronizar...', text: 'A enviar dados pendentes...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    for (let item of fila) {
      try { await fetch(API_URL, { method: 'POST', body: JSON.stringify(item) }); } catch (err) {}
    }
    localStorage.removeItem('filaOffline');
    Swal.fire({ title: 'Sincronizado!', text: 'Os dados foram sincronizados com sucesso.', icon: 'success' }).then(() => window.location.reload());
  }
});

    window.onload = async function() {const u = JSON.parse(localStorage.getItem('usuarioLogado') || 'null');
  if (u) {
    let nomeProf = u.nome || u.usuario?.nome || u.col1 || "Usuário";
    const elUser = document.getElementById('nomeUsuarioUi');
    if (elUser) {
      elUser.innerHTML = `<i class="bi bi-person-circle me-1"></i>${nomeProf}`;
    }
  }
      modalInstancia = new bootstrap.Modal(document.getElementById('modalEditar'));
      preencherAnos();
      
      const profs = await chamarAPI({ action: 'getProfessores' });
      const selCadProf = document.getElementById('cadProfessor');
      const selEditProf = document.getElementById('editProfessor');
      
      selCadProf.innerHTML = '<option value="">Selecione...</option>';
      selEditProf.innerHTML = '<option value="">Selecione...</option>';
      
      if(profs && profs.length > 0) {
        profs.forEach(p => {
          selCadProf.innerHTML += `<option value="${p}">${p}</option>`;
          selEditProf.innerHTML += `<option value="${p}">${p}</option>`;
        });
      } else {
        selCadProf.innerHTML = '<option value="">Aba PROFESSOR não encontrada ou vazia.</option>';
      }
    };
     

    function preencherAnos() {
      const selects = [document.getElementById('cadAno'), document.getElementById('buscaAno'), document.getElementById('editAno')];
      let htmlAnos = '<option value="">Selecione...</option>';
      for(let ano = 2024; ano <= 2030; ano++) {
        htmlAnos += `<option value="${ano}.1">${ano}.1</option>`;
        htmlAnos += `<option value="${ano}.2">${ano}.2</option>`;
      }
      selects.forEach(sel => { if(sel.id !== 'buscaAno') sel.innerHTML = htmlAnos; else sel.innerHTML = '<option value="">Filtrar Semestre...</option>' + htmlAnos; });
    }

    async function salvarNovaEletiva() {
      const dados = {
        ano: document.getElementById('cadAno').value,
        dia: document.getElementById('cadDia').value,
        turma: document.getElementById('cadTurma').value,
        vagas: document.getElementById('cadVagas').value,
        nome: document.getElementById('cadNome').value.toUpperCase(),
        professor: document.getElementById('cadProfessor').value
      };

      const btn = document.getElementById('btnCadastrar');
      btn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Cadastrando...'; btn.disabled = true;

      const resposta = await chamarAPI({ action: 'cadastrarEletiva', dados: dados });
      if(resposta && resposta.success) {
        Swal.fire({ title: 'Sucesso!', text: resposta.msg || 'Eletiva cadastrada!', icon: 'success', confirmButtonColor: '#0f766e' });
        document.getElementById('formCadastro').reset();
      }
      btn.innerHTML = '<i class="bi bi-save me-2"></i>Cadastrar Eletiva'; btn.disabled = false;
    }

    async function buscarEletivas() {
      const ano = document.getElementById('buscaAno').value;
      if(!ano) { 
        return Swal.fire({ title: 'Atenção', text: 'Selecione um semestre para pesquisar.', icon: 'warning', confirmButtonColor: '#0f766e' });
      }
      
      document.getElementById('loaderBusca').style.display = 'block';
      document.getElementById('areaTabela').style.display = 'none';
      document.getElementById('btnPdfEletivas').style.display = 'none';

      const eletivas = await chamarAPI({ action: 'buscarEletivasCadastradas', ano: ano });
      
      document.getElementById('loaderBusca').style.display = 'none';
      if(eletivas) {
        const tbody = document.getElementById('corpoTabela');
        tbody.innerHTML = '';
        if(eletivas.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Nenhuma eletiva encontrada para este semestre.</td></tr>';
        } else {
          document.getElementById('btnPdfEletivas').style.display = 'block';

          eletivas.forEach(e => {
            const dadosJson = JSON.stringify(e).replace(/'/g, "&apos;").replace(/"/g, "&quot;");
            
            tbody.innerHTML += `
              <tr>
                <td class="text-muted small">${e.id}</td>
                <td class="fw-medium">${e.dia}</td>
                <td>${e.turma}</td>
                <td>${e.nome}</td>
                <td>${e.professor}</td>
                <td class="text-center">${e.vagas}</td>
                <td class="text-center no-pdf">
                  <button class="btn btn-warning btn-sm me-1" title="Editar" onclick="abrirModalEdicao('${dadosJson}')"><i class="bi bi-pencil-fill"></i></button>
                  <button class="btn btn-danger btn-sm" title="Excluir" onclick="excluirEletiva(${e.linha})"><i class="bi bi-trash-fill"></i></button>
                </td>
              </tr>
            `;
          });
        }
        document.getElementById('areaTabela').style.display = 'block';
      }
    }

    function abrirModalEdicao(jsonString) {
      const dados = JSON.parse(jsonString);
      document.getElementById('editLinha').value = dados.linha;
      document.getElementById('editAno').value = dados.ano;
      document.getElementById('editDia').value = dados.dia;
      document.getElementById('editTurma').value = dados.turma;
      document.getElementById('editNome').value = dados.nome;
      document.getElementById('editVagas').value = dados.vagas;
      document.getElementById('editProfessor').value = dados.professor;
      modalInstancia.show();
    }

    async function salvarEdicao() {
      const linha = document.getElementById('editLinha').value;
      const dados = {
        linha: linha,
        ano: document.getElementById('editAno').value,
        dia: document.getElementById('editDia').value,
        turma: document.getElementById('editTurma').value,
        vagas: document.getElementById('editVagas').value,
        nome: document.getElementById('editNome').value.toUpperCase(),
        professor: document.getElementById('editProfessor').value
      };

      const btn = document.getElementById('btnSalvarEdicao');
      btn.innerHTML = 'Salvando...'; btn.disabled = true;

      const resposta = await chamarAPI({ action: 'editarEletiva', dados: dados });
      
      if(resposta && resposta.success) {
        Swal.fire({ title: 'Atualizado!', text: resposta.msg || 'Dados atualizados com sucesso.', icon: 'success', confirmButtonColor: '#0f766e' });
        modalInstancia.hide();
        buscarEletivas(); // Recarrega a tabela para mostrar as alterações
      }
      
      btn.innerHTML = 'Salvar Alterações'; btn.disabled = false;
    }

    function excluirEletiva(linha) {
      Swal.fire({
        title: 'Tem certeza?',
        text: "Você não poderá reverter a exclusão desta eletiva!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'Sim, excluir!',
        cancelButtonText: 'Cancelar'
      }).then(async (result) => {
        if (result.isConfirmed) {
          const resposta = await chamarAPI({ action: 'excluirEletiva', dados: { linha: linha } });
          if(resposta && resposta.success) {
            Swal.fire({ title: 'Excluído!', text: resposta.msg || 'Eletiva excluída com sucesso.', icon: 'success', confirmButtonColor: '#0f766e' });
            buscarEletivas(); // Atualiza a tabela
          }
        }
      });
    }

    function baixarPDFEletivas() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('landscape'); // Formato paisagem para caber mais colunas
  const semestre = document.getElementById('buscaAno').value;

  // --- INÍCIO DO CABEÇALHO PADRÃO ---
  try {
    const imgElement = document.getElementById('logoEscola');
    const canvas = document.createElement('canvas');
    canvas.width = imgElement.naturalWidth;
    canvas.height = imgElement.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgElement, 0, 0);
    const imgData = canvas.toDataURL('image/png');
    doc.addImage(imgData, 'PNG', 14, 10, 25, 25);
  } catch (e) {
    console.log("Aviso: Imagem bloqueada pelo navegador local para uso no PDF.");
  }

  doc.setFontSize(11);
  doc.setFont("helvetica", "bold");
  doc.text("ESCOLA DE ENSINO MÉDIO DE TEMPO INTEGRAL", 45, 17);
  doc.setFontSize(14);
  doc.text("AGOSTINHO NERES PORTELA", 45, 24);
  doc.setFontSize(10);
  doc.setFont("helvetica", "normal");
  doc.text("Educação Pública de Qualidade", 45, 30);

  doc.setLineWidth(0.5);
  doc.line(14, 37, 282, 37); // 282 porque é formato paisagem (landscape)
  // --- FIM DO CABEÇALHO PADRÃO ---

  doc.setFontSize(12);
  doc.setFont("helvetica", "bold");
  doc.text(`RELATÓRIO DE ELETIVAS CADASTRADAS`, 148, 45, { align: "center" });

  doc.setFontSize(10);
  doc.setFont("helvetica", "normal");
  doc.text(`Semestre: ${semestre}`, 14, 53);

  const dataAtual = new Date().toLocaleDateString('pt-BR');
  const horaAtual = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
  doc.text(`Emitido em: ${dataAtual} às ${horaAtual}`, 282, 53, { align: "right" });

  doc.autoTable({
    html: '#tabelaEletivas',
    startY: 60,
    theme: 'grid',
    headStyles: { fillColor: [15, 118, 110] }, // Cor verde do sistema
    columns: [
      { header: 'ID' }, { header: 'Dia' }, { header: 'Turma' },
      { header: 'Eletiva' }, { header: 'Professor' }, { header: 'Vagas' }
    ],
    columnStyles: { 6: { cellWidth: 0, halign: 'center', textColor: [255,255,255] } },
    didParseCell: function(data) {
      if (data.column.index === 6) {
         data.cell.styles.fillColor = [255, 255, 255];
         data.cell.text = '';
      }
    }
  });

  doc.save(`Relatorio_Eletivas_${semestre}.pdf`);
}

  </script>
</body>
</html>
