<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Funcionários - EEMTI</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #f4f7f6; 
      color: #333; 
    }

    /* CABEÇALHO */
    .navbar-custom { 
      background-color: transparent; 
      padding: 15px 20px; 
      border-bottom: 1px solid rgba(0,0,0,0.05); 
    }
    .navbar-brand { 
      font-weight: 700; 
      font-size: 1.3rem; 
      color: #1e293b !important; 
      display: flex; 
      align-items: center; 
      gap: 15px; 
    }
    .sub-text { font-size: 0.8rem; font-weight: 500; color: #64748b; margin-top: -3px; }
    .logo-escola { height: 45px; object-fit: contain; mix-blend-mode: multiply; }

    .main-container { padding: 30px 15px; max-width: 1000px; margin: 0 auto; }
    
    .page-title {
      text-align: center;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 30px;
    }

    .card { 
      border: none; 
      border-radius: 12px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.04); 
      margin-bottom: 30px; 
      background: white; 
    }
    .card-header-custom { 
      background: transparent; 
      border-bottom: 1px solid #eaeaea; 
      padding: 20px; 
      font-weight: 700;
      color: #0f766e;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .form-label { font-size: 0.85rem; font-weight: 600; color: #475569; }
    .form-control, .form-select { 
      border-radius: 8px; 
      border: 1px solid #cbd5e1; 
      padding: 10px 15px; 
      background-color: #f8fafc;
    }
    .form-control:focus, .form-select:focus { 
      border-color: #0f766e; 
      box-shadow: 0 0 0 0.25rem rgba(15, 118, 110, 0.15); 
      background-color: white;
    }

    .btn-primary-custom {
      background-color: #0f766e;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      width: 100%;
      transition: 0.2s;
    }
    .btn-primary-custom:hover { background-color: #0d5e56; color: white;}
    
    .table th { background-color: #f8fafc; border-bottom: 2px solid #e2e8f0; color: #475569; font-size: 0.9rem;}
    .table td { vertical-align: middle; font-size: 0.9rem; }
  </style>

  <script>
    // Proteção de rota inteligente e insensível a maiúsculas/minúsculas
    const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado') || 'null');
    const permissaoUser = ((usuarioLogado && (usuarioLogado.permissao || usuarioLogado.role)) || '').toUpperCase();

    if (!usuarioLogado || (permissaoUser !== 'ADMINISTRADOR' && permissaoUser !== 'DIREÇÃO' && permissaoUser !== 'DIRECAO')) {
      window.location.href = 'index.html'; // Apenas admin/direção pode acessar
    }
  </script>
</head>

<body>

  <!-- CABEÇALHO -->
  <nav class="navbar navbar-custom">
    <div class="container-fluid">
      <span class="navbar-brand">
        <img src="LOGO-removebg-preview.png" class="logo-escola" alt="Brasão" onerror="this.src='https://placehold.co/100?text=Logo'">
        <div>
          Cadastro de Funcionário
          <div class="sub-text">EEMTI Agostinho Neres</div>
        </div>
      </span>
      <a href="index.html" class="btn btn-outline-secondary btn-sm fw-semibold rounded-pill px-3 shadow-sm">
        <i class="bi bi-house-door-fill me-1"></i> Início
      </a>
    </div>
  </nav>

  <div class="main-container">
    <h3 class="page-title">Painel do Administrador - Gestão de Funcionários</h3>
    
    <!-- CARD DE CADASTRO -->
    <div class="card">
      <div class="card-header-custom">
        <span><i class="bi bi-person-plus-fill me-2"></i> Cadastrar / Editar Funcionário</span>
        <span id="badgeEdicao" class="badge bg-warning text-dark d-none">Modo de Edição</span>
      </div>
      <div class="card-body p-4">
        <form id="formFuncionario">
          <input type="hidden" id="funcId"> <!-- ID Oculto para edição -->
          
          <div class="row g-4 mb-4">
            <div class="col-md-12">
              <label class="form-label">Nome Completo</label>
              <input type="text" id="funcNome" class="form-control" required placeholder="Ex: João da Silva">
            </div>
            
            <div class="col-md-4">
              <label class="form-label">Celular / WhatsApp</label>
              <input type="text" id="funcContato" class="form-control" placeholder="Ex: 88 981526100">
            </div>
            
            <div class="col-md-4">
              <label class="form-label">E-mail</label>
              <input type="email" id="funcEmail" class="form-control" required placeholder="email@escola.com">
            </div>
            
            <div class="col-md-4">
              <label class="form-label">Permissão</label>
              <select id="funcPermissao" class="form-select" required>
                <option value="">Selecione...</option>
                <option value="Professor">Professor (Notas e Frequência)</option>
                <option value="Administrador">Administrador</option>
                <option value="Direção">Direção</option>
              </select>
            </div>
          </div>
          
          <div class="d-flex gap-2">
            <button type="button" id="btnCancelar" class="btn btn-light d-none w-25 fw-bold" onclick="cancelarEdicao()">Cancelar</button>
            <button type="submit" class="btn btn-primary-custom" id="btnSalvar"><i class="bi bi-check-circle-fill me-2"></i>Registar Funcionário</button>
          </div>
        </form>
      </div>
    </div>

    <!-- CARD DE CONSULTA -->
    <div class="card">
      <div class="card-header-custom d-flex justify-content-between">
        <span><i class="bi bi-search me-2"></i> Consultar e Gerir Funcionários</span>
        <button class="btn btn-sm btn-outline-secondary" onclick="carregarFuncionarios()"><i class="bi bi-arrow-clockwise me-1"></i> Atualizar Lista</button>
      </div>
      <div class="card-body p-4">
        
        <div class="mb-4">
          <label class="form-label">Pesquisa Inteligente por Nome ou E-mail</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
            <input type="text" id="buscaFuncionario" class="form-control" placeholder="Comece a digitar o nome do funcionário..." onkeyup="filtrarTabela()">
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover border" id="tabelaFuncionarios">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Contato</th>
                <th>E-mail</th>
                <th>Permissão</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody id="listaBody">
              <tr><td colspan="5" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm me-2"></div>Carregando utilizadores...</td></tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyNedpZQsNt5lzHtrCSRfC4bWFEuCHHkZ4ygbm-DDm0NUBVARwS5GNFMu2zB3WutFE/exec";
    let funcionariosAtuais = [];

    // Carregar Lista ao abrir a página
    window.onload = () => carregarFuncionarios();

    // 1. CARREGAR FUNCIONÁRIOS
    async function carregarFuncionarios() {
      const tbody = document.getElementById('listaBody');
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4"><div class="spinner-border spinner-border-sm me-2"></div>Carregando...</td></tr>';
      
      try {
        const res = await fetch(API_URL + "?v=" + new Date().getTime(), {
          method: 'POST',
          body: JSON.stringify({ action: 'listarFuncionarios' })
        });
        const dados = await res.json();
        
        if (dados && dados.success) {
          funcionariosAtuais = dados.lista || [];
          renderizarTabela(funcionariosAtuais);
        } else {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">Erro ao carregar dados do servidor.</td></tr>';
        }
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">Falha na conexão.</td></tr>';
      }
    }

    // 2. RENDERIZAR TABELA
    function renderizarTabela(lista) {
      const tbody = document.getElementById('listaBody');
      tbody.innerHTML = '';
      
      if (!lista || lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-3">Nenhum funcionário cadastrado.</td></tr>';
        return;
      }

      lista.forEach(f => {
        let permNorm = (f.permissao || '').toLowerCase();
        let corBadge = permNorm.includes('admin') ? 'bg-danger' : (permNorm.includes('direç') || permNorm.includes('direc') ? 'bg-primary' : 'bg-success');
        
        const dJson = JSON.stringify(f).replace(/'/g, "&apos;").replace(/"/g, "&quot;");

        tbody.innerHTML += `
          <tr>
            <td class="fw-bold">${f.nome}</td>
            <td>${f.contato || '-'}</td>
            <td>${f.email}</td>
            <td><span class="badge ${corBadge}">${f.permissao}</span></td>
            <td class="text-center">
              <button class="btn btn-warning btn-sm me-1 shadow-sm" onclick="prepararEdicao('${dJson}')" title="Editar"><i class="bi bi-pencil-fill"></i></button>
              <button class="btn btn-danger btn-sm shadow-sm" onclick="excluirFuncionario('${f.id}')" title="Excluir"><i class="bi bi-trash-fill"></i></button>
            </td>
          </tr>
        `;
      });
    }

    // 3. PESQUISA NA TABELA
    function filtrarTabela() {
      const termo = document.getElementById('buscaFuncionario').value.toLowerCase();
      const filtrados = funcionariosAtuais.filter(f => 
        (f.nome || '').toLowerCase().includes(termo) || 
        (f.email || '').toLowerCase().includes(termo)
      );
      renderizarTabela(filtrados);
    }

    // 4. SALVAR / EDITAR FUNCIONÁRIO
    document.getElementById('formFuncionario').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btnSalvar = document.getElementById('btnSalvar');
      btnSalvar.disabled = true;
      btnSalvar.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Salvando...';

      const payload = {
        action: 'salvarFuncionario',
        dados: {
          id: document.getElementById('funcId').value,
          nome: document.getElementById('funcNome').value.trim(),
          contato: document.getElementById('funcContato').value.trim(),
          email: document.getElementById('funcEmail').value.trim(),
          permissao: document.getElementById('funcPermissao').value
        }
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const resp = await res.json();

        if (resp.success) {
          Swal.fire('Sucesso!', 'Funcionário salvo com sucesso.', 'success');
          cancelarEdicao();
          carregarFuncionarios();
        } else {
          Swal.fire('Erro', resp.error || 'Não foi possível salvar.', 'error');
        }
      } catch (err) {
        Swal.fire('Erro', 'Falha na comunicação com o servidor.', 'error');
      }
      
      btnSalvar.disabled = false;
      btnSalvar.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i>Registar Funcionário';
    });

    // 5. PREPARAR FORMULÁRIO PARA EDIÇÃO
    function prepararEdicao(jsonStr) {
      const f = JSON.parse(jsonStr);
      document.getElementById('funcId').value = f.id;
      document.getElementById('funcNome').value = f.nome;
      document.getElementById('funcContato').value = f.contato || '';
      document.getElementById('funcEmail').value = f.email;
      document.getElementById('funcPermissao').value = f.permissao;
      
      document.getElementById('badgeEdicao').classList.remove('d-none');
      document.getElementById('btnCancelar').classList.remove('d-none');
      
      const btnSalvar = document.getElementById('btnSalvar');
      btnSalvar.classList.replace('btn-primary-custom', 'btn-warning');
      btnSalvar.innerHTML = '<i class="bi bi-pencil-square me-2"></i>Atualizar Funcionário';
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 6. CANCELAR EDIÇÃO E LIMPAR FORM
    function cancelarEdicao() {
      document.getElementById('formFuncionario').reset();
      document.getElementById('funcId').value = "";
      
      document.getElementById('badgeEdicao').classList.add('d-none');
      document.getElementById('btnCancelar').classList.add('d-none');
      
      const btnSalvar = document.getElementById('btnSalvar');
      btnSalvar.classList.replace('btn-warning', 'btn-primary-custom');
      btnSalvar.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i>Registar Funcionário';
    }

    // 7. EXCLUIR FUNCIONÁRIO
    async function excluirFuncionario(id) {
      const confirmacao = await Swal.fire({
        title: 'Tem a certeza?',
        text: "Este usuário perderá o acesso ao sistema!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#e11d48',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Sim, Excluir',
        cancelButtonText: 'Cancelar'
      });

      if (confirmacao.isConfirmed) {
        Swal.fire({ title: 'A excluir...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        
        try {
          const res = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'excluirFuncionario', id: id })
          });
          const resp = await res.json();

          if (resp.success) {
            Swal.fire('Excluído!', 'O funcionário foi removido.', 'success');
            carregarFuncionarios();
          } else {
            Swal.fire('Erro', resp.error, 'error');
          }
        } catch (e) {
          Swal.fire('Erro', 'Falha na conexão.', 'error');
        }
      }
    }
  </script>
</body>
</html>
