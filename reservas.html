<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas de Ambientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
    .navbar { background-color: #fff; border-bottom: 1px solid #dee2e6; }
    .card { border: none; border-radius: 10px; box-shadow: 0 2px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .btn-tema { background-color: #0f766e; color: white; }
    .btn-tema:hover { background-color: #0d645e; color: white; }
    .aula-checkbox { width: 100px; }
  </style>
</head>
<body>

  <nav class="navbar p-3">
    <div class="container-fluid max-w-900 mx-auto">
      <span class="navbar-brand fw-bold text-teal"><i class="bi bi-calendar-check me-2"></i>Reservas de Ambientes</span>
      <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill fw-bold">Voltar</a>
    </div>
  </nav>

  <div class="container mt-4" style="max-width: 900px;">
    <!-- Formulário -->
    <div class="card p-4">
      <h5 class="fw-bold mb-3" id="tituloForm"><i class="bi bi-plus-circle text-primary me-2"></i>Nova Reserva</h5>
      
      <input type="hidden" id="editLinha" value="">
      <input type="hidden" id="editId" value="">

      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label fw-bold">Data da Reserva</label>
          <input type="date" id="inputData" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">Ambiente / Material</label>
          <select id="selectAmbiente" class="form-select"><option>A carregar...</option></select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">Professor / Gestão</label>
          <select id="selectProfessor" class="form-select"><option>A carregar...</option></select>
        </div>
      </div>

      <label class="form-label fw-bold mb-2">Selecione as Aulas:</label>
      <div class="d-flex flex-wrap gap-2 mb-4" id="containerAulas">
        <!-- Checkboxes gerados dinamicamente -->
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button id="btnCancelar" class="btn btn-outline-danger d-none" onclick="cancelarEdicao()">Cancelar Edição</button>
        <button class="btn btn-tema px-4" onclick="salvarReserva()"><i class="bi bi-check2-circle me-1"></i>Salvar Reserva</button>
      </div>
    </div>

    <!-- Tabela -->
    <div class="card p-4">
      <h5 class="fw-bold mb-3"><i class="bi bi-table text-success me-2"></i>Reservas Registadas</h5>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Data</th>
              <th>Professor</th>
              <th>Ambiente</th>
              <th>Aulas Reservadas</th>
              <th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaBody">
            <tr><td colspan="5" class="text-center py-4">A carregar...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ COLOQUE O SEU LINK AQUI:
    const API_URL = "https://script.google.com/macros/s/AKfycbyNedpZQsNt5lzHtrCSRfC4bWFEuCHHkZ4ygbm-DDm0NUBVARwS5GNFMu2zB3WutFE/exec";
    let listaReservas = [];

    window.onload = async () => {
      gerarCheckboxes();
      await carregarDropdowns();
      await atualizarTabela();
    };

    function gerarCheckboxes() {
      let html = "";
      for(let i=1; i<=9; i++) {
        html += `
          <div class="form-check aula-checkbox border rounded p-2 text-center bg-light">
            <input class="form-check-input float-none ms-0 mb-1 aula-chk" type="checkbox" value="${i}ª Aula" id="aula${i}">
            <label class="form-check-label d-block text-muted small fw-bold" for="aula${i}">${i}ª Aula</label>
          </div>`;
      }
      document.getElementById('containerAulas').innerHTML = html;
    }

    async function fetchAPI(payload) {
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
      return await res.json();
    }

    async function carregarDropdowns() {
      // Puxa Ambientes (Aba AMBIENTE/MATERIAL)
      const resAmb = await fetchAPI({ action: 'listarConfig', tipo: 'AMBIENTE' });
      let htmlAmb = '<option value="">Selecione...</option>';
      if(resAmb.success) resAmb.lista.forEach(i => htmlAmb += `<option value="${i.col1}">${i.col1}</option>`);
      document.getElementById('selectAmbiente').innerHTML = htmlAmb;

      // Puxa Professores
      const resProf = await fetchAPI({ action: 'getProfessores' });
      let htmlProf = '<option value="">Selecione...</option>';
      if(Array.isArray(resProf)) resProf.forEach(p => htmlProf += `<option value="${p}">${p}</option>`);
      document.getElementById('selectProfessor').innerHTML = htmlProf;
    }

    // Formata Data de yyyy-mm-dd para dd/mm/yyyy
    function formatarDataBR(dataIso) {
      if(!dataIso) return "";
      const p = dataIso.split('-');
      return `${p[2]}/${p[1]}/${p[0]}`;
    }

    // Converte de dd/mm/yyyy para yyyy-mm-dd para o input type="date"
    function formatarDataInput(dataBr) {
      if(!dataBr || !dataBr.includes('/')) return dataBr;
      const p = dataBr.split('/');
      return `${p[2]}-${p[1]}-${p[0]}`;
    }

    async function atualizarTabela() {
      const res = await fetchAPI({ action: 'listarReservas' });
      if(res.success) {
        listaReservas = res.lista || [];
        let html = '';
        listaReservas.forEach((item, index) => {
          if(item.linha === 1) return; // ignora cabeçalho
          let aulasTexto = item.aulas.filter(a => a !== "").join(", ");
          html += `
            <tr>
              <td class="fw-bold">${item.data}</td>
              <td>${item.professor}</td>
              <td>${item.ambiente}</td>
              <td class="small">${aulasTexto}</td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary" onclick="editar(${index})"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger" onclick="excluir(${item.linha})"><i class="bi bi-trash"></i></button>
              </td>
            </tr>`;
        });
        document.getElementById('tabelaBody').innerHTML = html || '<tr><td colspan="5" class="text-center">Nenhuma reserva.</td></tr>';
      }
    }

    async function salvarReserva() {
      const dataIso = document.getElementById('inputData').value;
      const ambiente = document.getElementById('selectAmbiente').value;
      const professor = document.getElementById('selectProfessor').value;
      
      if(!dataIso || !ambiente || !professor) return Swal.fire('Aviso', 'Preencha Data, Ambiente e Professor.', 'warning');
      
      let aulasArr = [];
      let temAula = false;
      for(let i=1; i<=9; i++) {
        let chk = document.getElementById('aula'+i);
        if(chk.checked) { aulasArr.push(chk.value); temAula = true; }
        else { aulasArr.push(""); }
      }

      if(!temAula) return Swal.fire('Aviso', 'Selecione pelo menos uma aula.', 'warning');

      Swal.fire({title: 'Validando...', didOpen: () => Swal.showLoading()});

      const payload = {
        action: 'salvarReserva',
        linha: parseInt(document.getElementById('editLinha').value) || null,
        id: document.getElementById('editId').value || null,
        data: formatarDataBR(dataIso),
        ambiente: ambiente,
        professor: professor,
        aulas: aulasArr
      };

      const res = await fetchAPI(payload);
      if(res.success) {
        Swal.fire('Sucesso', 'Reserva efetuada com sucesso!', 'success');
        cancelarEdicao();
        atualizarTabela();
      } else {
        Swal.fire('Conflito de Horário', res.error, 'error');
      }
    }

    function editar(index) {
      const item = listaReservas[index];
      document.getElementById('inputData').value = formatarDataInput(item.data);
      document.getElementById('selectAmbiente').value = item.ambiente;
      document.getElementById('selectProfessor').value = item.professor;
      document.getElementById('editLinha').value = item.linha;
      document.getElementById('editId').value = item.id;
      
      for(let i=1; i<=9; i++) {
        document.getElementById('aula'+i).checked = item.aulas.includes(i+"ª Aula");
      }

      document.getElementById('tituloForm').innerHTML = "Editar Reserva";
      document.getElementById('btnCancelar').classList.remove('d-none');
      window.scrollTo(0,0);
    }

    function cancelarEdicao() {
      document.getElementById('inputData').value = "";
      document.getElementById('selectAmbiente').value = "";
      document.getElementById('selectProfessor').value = "";
      document.getElementById('editLinha').value = "";
      document.getElementById('editId').value = "";
      for(let i=1; i<=9; i++) document.getElementById('aula'+i).checked = false;
      
      document.getElementById('tituloForm').innerHTML = "Nova Reserva";
      document.getElementById('btnCancelar').classList.add('d-none');
    }

    async function excluir(linha) {
      if(await Swal.fire({title: 'Excluir reserva?', icon: 'warning', showCancelButton: true}).then(r => r.isConfirmed)) {
        Swal.fire({title: 'Excluindo...', didOpen: () => Swal.showLoading()});
        await fetchAPI({ action: 'excluirReserva', linha: linha });
        Swal.fire('Excluído', '', 'success');
        atualizarTabela();
      }
    }
  </script>
</body>
</html>
